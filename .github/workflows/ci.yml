name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check, build, unit and integration tests, coverage
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Start app (dev profile) and wait for health UP
        run: |
          SPRING_PROFILES_ACTIVE=dev NMS_DATA_DIR="$(mktemp -d)" \
            nohup java -jar target/nms-*.jar > "$RUNNER_TEMP/nms-demo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/nms-demo.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | jq -e '.status == "UP"' > /dev/null 2>&1; then
              exit 0
            fi
            kill -0 "$(cat "$RUNNER_TEMP/nms-demo.pid")" 2> /dev/null || { echo "App exited during startup"; exit 1; }
            sleep 1
          done
          echo "App not UP after 60s"
          exit 1

      - name: Demo script smoke run
        timeout-minutes: 5
        run: scripts/demo.sh

      - name: Stop app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nms-demo.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/nms-demo.pid")" 2> /dev/null || true
          fi
          if [ "${{ job.status }}" != "success" ] && [ -f "$RUNNER_TEMP/nms-demo.log" ]; then
            echo "App log (last 200 lines):"
            tail -n 200 "$RUNNER_TEMP/nms-demo.log"
          fi

      - name: Build Docker image
        run: docker build -t nms:ci .

      - name: Verify image runs as non-root
        run: test "$(docker run --rm --entrypoint id nms:ci -u)" != "0"

      - name: Test and coverage summary
        if: always()
        run: |
          read tests failures errors skipped < <(cat target/surefire-reports/TEST-*.xml target/failsafe-reports/TEST-*.xml 2>/dev/null \
            | grep -o '<testsuite [^>]*>' \
            | awk '{ for (i = 1; i <= NF; i++) { split($i, kv, "="); gsub(/"/, "", kv[2]);
                       if (kv[1] == "tests") t += kv[2]; if (kv[1] == "failures") f += kv[2];
                       if (kv[1] == "errors") e += kv[2]; if (kv[1] == "skipped") s += kv[2] } }
                   END { print t + 0, f + 0, e + 0, s + 0 }')
          coverage=$(awk -F, 'NR > 1 { m += $8; c += $9 } END { if (m + c > 0) printf "%.1f%%", 100 * c / (m + c); else print "n/a" }' target/site/jacoco/jacoco.csv 2>/dev/null || echo "n/a")
          {
            echo "## Tests and coverage"
            echo "| Tests | Passed | Failed | Errors | Skipped | Line coverage |"
            echo "|---|---|---|---|---|---|"
            echo "| $tests | $((tests - failures - errors - skipped)) | $failures | $errors | $skipped | $coverage |"
          } >> "$GITHUB_STEP_SUMMARY"
