spring:
  application:
    name: nms
  datasource:
    url: jdbc:h2:file:${NMS_DATA_DIR:./data}/nms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        # Pads IN lists to a power of two, so 1..100 recipients share a few cached statement plans.
        query.in_clause_parameter_padding: true
        # Flyway owns the schema; do not let Hibernate create helper tables at startup.
        query.mutation_strategy.global_temporary.create_tables: false
  h2:
    console:
      enabled: false
  # Used only with nms.kafka.enabled=true (ADR-0008). Broker: SPRING_KAFKA_BOOTSTRAP_SERVERS
  # (default localhost:9092).
  kafka:
    producer:
      properties:
        # A publish waits at most this for broker metadata, then fails; the poller sends the row.
        "[max.block.ms]": 1000
    consumer:
      group-id: nms-delivery
      # A new group starts at the oldest retained message; ids already sent are skipped.
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    # Hibernate logs JDBC errors with their message, which quotes column values (e.g. a duplicate
    # key). The exception still propagates and is logged redacted where it is handled.
    org.hibernate.orm.jdbc.error: OFF
  structured:
    format:
      console: ecs

nms:
  idempotency:
    # How long an accepted Idempotency-Key is honored (ADR-0002); afterwards it may create a new submission.
    retention: ${NMS_IDEMPOTENCY_RETENTION:7d}
  dedup:
    # Event dedup (ADR-0006): a repeat of the same event and message for a recipient under a new key,
    # within the window, is suppressed. false = greenfield behaviour (no lookup, nothing suppressed).
    enabled: ${NMS_DEDUP_ENABLED:true}
    # Measured from the original's submission; must be positive. Independent of idempotency retention.
    # Both settings are read at startup: a change takes effect on restart.
    window: ${NMS_DEDUP_WINDOW:24h}
  routing:
    # Channels added per severity (A-26). A missing address withholds them; an opt-out does too, except for CRITICAL (A-30).
    severity-escalation:
      CRITICAL: [SMS]
    # Provider per channel; startup fails if a channel has none.
    providers:
      EMAIL: sim-email
      SMS: sim-sms
  worker:
    # Delivery worker (ADR-0004). Off: nothing is sent; deliveries stay queued.
    enabled: ${NMS_WORKER_ENABLED:true}
    poll-interval: 500ms
    batch-size: 20
    # A SENDING claim older than this is reclaimed and resent with the same deliveryId.
    lease: 30s
    # Adapter contract: a send returns within this (TIMEOUT otherwise). Must be shorter than lease.
    send-timeout: 10s
    # Send attempts per delivery, including the first (A-40).
    max-attempts: 3
    # Retry n waits base * 2^(n-1) / 2 plus random up to the same again (equal jitter).
    backoff-base: 500ms
  kafka:
    # Kafka fast path for EMAIL first dispatch (ADR-0008). Off: the poller sends everything, no broker.
    enabled: ${NMS_KAFKA_ENABLED:false}
    # With Kafka on, the poller takes a new EMAIL first dispatch only once created longer ago than
    # this, or once moved (postpone, rate-limit deferral). Positive.
    poller-grace: 30s
    # Topic partitions (when created here) and consumer threads: the throughput knobs. Positive.
    partitions: 3
    concurrency: 3
  rate-limit:
    # Outbound sends per source system and channel per fixed window (ADR-0007); every attempt counts,
    # CRITICAL included. Over the limit a delivery waits for the next window (status unchanged).
    # In memory, per instance. All values must be positive; read at startup.
    window: 1m
    per-source:
      EMAIL: 600
      SMS: 60
    # Any channel not listed under per-source.
    default-per-source: 30
  simulator:
    callbacks:
      # Simulated vendors post the outcome to our webhook after accepting a send (ADR-0003).
      # Dev and demo only: tokens are the plaintext demo tokens, configured in application-dev.yml.
      enabled: ${NMS_SIMULATOR_CALLBACKS_ENABLED:false}
      delay: 1s
      # Blank: this server (http://localhost:<port>).
      base-url: ""
  security:
    # keyId:sourceSystem:sha256hex[,...] (ADR-0001). Empty: every /api request is rejected with 401.
    api-keys: ${NMS_API_KEYS:}
    # provider:sha256hex[,...] (ADR-0001). Empty: every webhook call is rejected with 401.
    webhook-tokens: ${NMS_WEBHOOK_TOKENS:}
